name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check sources
        run: |
          if [ -f "src/main.py" ]; then
            echo "✅ src/main.py найден!"
          else
            echo "⚠️ src/main.py не найден"
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build -t builder .

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            --user root \
            -e USE_X11=0 \
            -e KIVY_GL_BACKEND=sdl2 \
            -e KIVY_NO_X11=1 \
            -e KIVY_USE_X11=0 \
            builder bash -c "
              # Исправляем права для builder
              chown -R builder:builder /app
              chmod -R 755 /app
              
              # Запускаем сборку от builder
              su builder -c '
                cd /app
                rm -rf .buildozer/ bin/
                echo \"=== Starting build ===\"
                buildozer android debug --verbose 2>&1 | tee build.log
              '
            "

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

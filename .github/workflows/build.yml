name: Build Android APK

on:
  push:
    branches: [ main, Vizelb_dev ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check sources
        run: |
          if [ -f "src/main.py" ]; then
            echo "✅ src/main.py найден!"
          else
            echo "⚠️ src/main.py не найден"
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build -t builder .

      - name: Build APK
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            --user root \
            -e USE_X11=0 \
            -e KIVY_GL_BACKEND=sdl2 \
            -e KIVY_NO_X11=1 \
            -e KIVY_USE_X11=0 \
            builder bash -c "
              # Исправляем права для builder
              chown -R builder:builder /app
              chmod -R 755 /app
              
              # Запускаем сборку от builder
              su builder -s /bin/bash -c '
                set -o pipefail
                cd /app
                rm -rf .buildozer/ bin/
                echo \"=== Starting build ===\"
                buildozer android debug --verbose 2>&1 | tee build.log
              '
            "

      - name: Показать причину падения
        if: failure()
        run: |
          echo "=== последние 120 строк build.log ==="
          tail -n 120 build.log || echo "build.log отсутствует"
          # Дублируем ключевые строки в annotation: она, в отличие от логов
          # шагов и артефактов, читается через публичный API без токена —
          # причину падения видно, не скачивая 7 МБ лога.
          if [ -f build.log ]; then
            SUMMARY=$(grep -aE "fatal error|error:|^\[ERROR\]|Build failed|No matching distribution" build.log \
              | tail -n 12 | cut -c1-220 | tr '\n' '~' | cut -c1-2500)
            echo "::error title=Причина падения::${SUMMARY}"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: musictrainer-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
